name: DAST Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ── Unit + Regression Tests ───────────────────────────────────────────────
  unit-tests:
    name: Unit & Regression Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest --cov=src --cov-report=xml --cov-report=term-missing

      - name: Enforce coverage
        run: python -m coverage report --fail-under=75

  # ── SAST ──────────────────────────────────────────────────────────────────
  sast:
    name: SAST (bandit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run bandit (exclude intentionally vulnerable target)
        run: |
          pip install bandit[sarif]
          # Scan only non-intentionally-vulnerable code
          bandit -r tests/ -f sarif -o bandit-results.sarif || true
          bandit -r tests/ -f txt -ll

      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: bandit-results.sarif

  # ── DAST (ZAP) ────────────────────────────────────────────────────────────
  dast:
    name: DAST Scan (OWASP ZAP)
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Build target application
        run: docker build -f Dockerfile.target -t dast-target:ci .

      - name: Start target application
        run: |
          docker run -d \
            --name dast-target \
            -e APP_ENV=test \
            -p 127.0.0.1:5000:5000 \
            dast-target:ci
          # Wait for health
          timeout 30 sh -c 'until curl -s http://127.0.0.1:5000/health; do sleep 2; done'

      - name: Run ZAP baseline scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: "http://127.0.0.1:5000"
          rules_file_name: "zap-config/zap-rules.tsv"
          fail_action: false  # report findings but don't block on baseline

      - name: Upload ZAP report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-report
          path: |
            report_html.html
            report_json.json
          retention-days: 30

      - name: Enforce severity thresholds
        # Block on HIGH alerts
        run: |
          HIGH=$(cat report_json.json | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          alerts=[a for s in d.get('site',[]) for a in s.get('alerts',[]) if int(a.get('riskcode',0)) >= 4]
          print(len(alerts))
          " 2>/dev/null || echo "0")
          echo "High-risk alerts: $HIGH"
          [ "$HIGH" -eq 0 ] || (echo "::error::DAST found $HIGH HIGH-risk findings" && exit 1)

      - name: Stop target
        if: always()
        run: docker stop dast-target || true
