[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "secure-dast-pipeline"
version = "1.0.0"
description = "DAST pipeline with OWASP ZAP — isolated vulnerable target and scan automation"
requires-python = ">=3.11"
dependencies = ["flask>=3.0"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "bandit>=1.8",
    "requests>=2.31",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
pythonpath = ["."]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 75
show_missing = true

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "S", "UP"]
ignore = ["S101", "S308", "S701", "S608"]  # intentional in test target

[tool.ruff.lint.per-file-ignores]
"src/target_app/app.py" = ["S", "B"]  # intentionally vulnerable
"tests/*" = ["S"]
